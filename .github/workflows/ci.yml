name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pure-Python readers (NVIDIA CSV, AMD rocprof CSV, Linux perf, Metal JSON)
# parse committed text/JSON fixtures, so the full registry/platform/backend suite
# runs on every OS with NO GPU and NO profiler installed. Real binary-capture
# tests are fixture-gated and skip when their hardware report is absent.
# The macOS job digesting the NVIDIA fixture IS the "CUDA-dev-on-a-Mac" proof.
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The full requires-python range on every OS, floor (3.10) to
        # free-threaded 3.14 ("3.14t" is uv's key for the cp314t build).
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    # Windows 3.14t's known pywin32==312 wheel gap is recognized only in the
    # install step. No job-level allowed failure can hide new SDK/test failures.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (dev only — pure-Python readers cover the suite, no hardware)
        id: sync
        run: uv run --no-project --python ${{ matrix.python }} python tests/ci_sync.py ${{ matrix.python }}
      - name: Run tests
        if: steps.sync.outputs.run_tests == 'true'
        # run must pin the SAME python + extras as sync: with a bare `uv run`,
        # a python-version mismatch recreates the venv without the dev extra
        # and pytest vanishes mid-job.
        run: uv run --locked --extra dev --python ${{ matrix.python }} pytest -q
      - name: Real legacy SDK clients against the migrated stdio server
        if: steps.sync.outputs.run_tests == 'true'
        run: uv run --locked --extra dev --python ${{ matrix.python }} python tests/run_legacy_client.py
      - name: Keep stdio compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-compat-${{ matrix.os }}-${{ matrix.python }}
          path: |
            work/mcp-compat/*.json
            work/mcp-compat/*.txt
          if-no-files-found: ignore

  wheel:
    name: wheel (ubuntu-latest, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Clean wheel install, dependency resolution and real stdio
        run: uv run --no-project --python ${{ matrix.python }} python tests/verify_wheel.py
      - name: Keep clean wheel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-compat-${{ matrix.python }}
          path: work/wheel-check/*.json
          if-no-files-found: ignore
